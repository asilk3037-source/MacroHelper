name: Release

# Dispara quando você fizer push de uma tag no formato v1.2.3
on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore MacroHelper.UI/MacroHelper.UI.csproj

      - name: Publish (single-file, self-contained, win-x64)
        run: >
          dotnet publish MacroHelper.UI/MacroHelper.UI.csproj
          -c Release
          -r win-x64
          --self-contained true
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          -o ./publish

      - name: Create GitHub Release with asset
        uses: softprops/action-gh-release@v2
        with:
          files: ./publish/MacroHelper.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
