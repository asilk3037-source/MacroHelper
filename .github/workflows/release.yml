name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Definir versão
      run: echo "VER=1.2.0.${{ github.run_number }}" >> $env:GITHUB_ENV
      shell: pwsh

    - name: Atualizar versão no csproj
      run: |
        $f = "MacroHelper.UI/MacroHelper.UI.csproj"
        $c = Get-Content $f -Raw
        $c = $c -replace '<Version>[^<]+</Version>',                       "<Version>$env:VER</Version>"
        $c = $c -replace '<AssemblyVersion>[^<]+</AssemblyVersion>',       "<AssemblyVersion>$env:VER</AssemblyVersion>"
        $c = $c -replace '<FileVersion>[^<]+</FileVersion>',               "<FileVersion>$env:VER</FileVersion>"
        Set-Content $f $c -Encoding utf8
      shell: pwsh

    - name: Publicar
      run: dotnet publish MacroHelper.UI -c Release -r win-x64 --self-contained true -o publish

    - name: Zipar pasta de publicação
      run: Compress-Archive -Path "publish/*" -DestinationPath "MacroHelper.zip" -Force
      shell: pwsh

    - name: Remover releases anteriores
      run: |
        $list = gh release list --json tagName --jq '.[].tagName' 2>$null
        if ($list) {
          $list -split "`n" | Where-Object { $_ -ne "" } | ForEach-Object {
            gh release delete $_ --yes --cleanup-tag 2>$null
          }
        }
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: pwsh
      continue-on-error: true

    - name: Criar release
      run: |
        $data = (Get-Date).ToString("dd/MM/yyyy HH:mm")
        gh release create "v$env:VER" "MacroHelper.zip" `
          --title "MacroHelper v$env:VER" `
          --notes "Versao $env:VER - publicada automaticamente em $data.`n`nExtrai o ZIP e execute MacroHelper.exe." `
          --latest
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: pwsh
